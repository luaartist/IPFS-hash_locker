[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ipfs-locker"
version = "0.1.0"
description = "Cryptographic IPFS hash locker and provenance engine"
authors = [{ name = "Wallace Shukla", email = "wallacelebrun@gmail.com" }]
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "cryptography>=42.0.0",
    "requests>=2.31.0",
    "PyMuPDF>=1.24.0",
    "blake3>=0.4.1",
    "cbor2>=5.6.0",
    "zstandard>=0.22.0",
]

[project.scripts]
ipfs-locker = "ipfs_locker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ipfs_locker*"]
